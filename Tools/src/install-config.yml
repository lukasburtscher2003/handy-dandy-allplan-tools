plugin:
  name: HJ Tools
  UUID: 2d934cb8-9941-4863-8302-d472023100a8
  version: 2.0.0
  developer: lukasburtscher
  default-language: de
  min-allplan-version: 2027

installation:
  target-location: USR

tools:
  - id: dev-help
    pyp: Library\HJ_Tools\Dev-Tutorial.pyp
    display-name:
      de: Entwickler Hilfe
      en: Developer help
    icons:
      small: PythonPartsActionbar\HJ_Tools\dev-tutorial_24x24.png
      large: PythonPartsActionbar\HJ_Tools\dev-tutorial_128x128.png

  - id: urbgen
    pyp: Library\HJ_Tools\UrbGEN-v1.0.0.pyp
    display-name:
      de: Bebauungsvarianten
      en: Urban-Generation
    icons:
      small: PythonPartsActionbar\HJ_Tools\urbgen_24x24.png
      large: PythonPartsActionbar\HJ_Tools\urbgen_128x128.png

  - id: geoimport
    pyp: Library\HJ_Tools\GeoIMPORT.pyp
    display-name:
      de: Geodatenimport
      en: Geo-data-import
    icons:
      small: PythonPartsActionbar\HJ_Tools\geoimport_24x24.png
      large: PythonPartsActionbar\HJ_Tools\geoimport_128x128.png

  - id: modelcheck
    pyp: Library\HJ_Tools\GeoIMPORT.pyp
    display-name:
      de: Modelcheck
      en: Modelcheck
    icons:
      small: PythonPartsActionbar\HJ_Tools\modelcheck_24x24.png
      large: PythonPartsActionbar\HJ_Tools\modelcheck_128x128.png

task-area:
  display-name:
    de: HJ Tools
    en: HJ Tools
  layout:
    - dev-help
    - "****"
    - urbgen
    - geoimport
    - modelcheck